<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GIF Frame Viewer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><span>GIF</span><strong data-i18n="title"></strong></div>
    <button id="helpButton" class="icon-button" type="button" aria-label="Help" title="Help">?</button>
  </header>

  <main>
    <section class="setting-row primary-setting">
      <label for="enabled" data-i18n="extensionEnabled"></label>
      <input id="enabled" type="checkbox" role="switch">
    </section>

    <section>
      <h2 data-i18n="siteAccess"></h2>
      <div class="setting-row">
        <div class="site-name"><span data-i18n="currentSite"></span><strong id="currentHost">-</strong></div>
        <input id="currentSiteEnabled" type="checkbox" role="switch">
      </div>
      <label class="field-label" for="siteMode" data-i18n="siteMode"></label>
      <select id="siteMode">
        <option value="block" data-i18n="blockMode"></option>
        <option value="allow" data-i18n="allowMode"></option>
      </select>
      <div class="domain-entry">
        <input id="domainInput" type="text" inputmode="url" autocomplete="off">
        <button id="addDomain" type="button" title="Add">+</button>
      </div>
      <div id="siteList" class="site-list"></div>
    </section>

    <section>
      <h2 data-i18n="performance"></h2>
      <label class="field-label" for="cacheItems" data-i18n="cacheItems"></label>
      <select id="cacheItems">
        <option value="1" data-i18n="oneRecommended"></option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
      <label class="field-label" for="cacheSizeMB" data-i18n="cacheSize"></label>
      <select id="cacheSizeMB">
        <option value="64">64 MB</option>
        <option value="150" data-i18n="mbRecommended"></option>
        <option value="256">256 MB</option>
        <option value="512">512 MB</option>
      </select>
    </section>

    <section>
      <h2 data-i18n="language"></h2>
      <select id="language">
        <option value="auto" data-i18n="autoRecommended"></option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </section>
  </main>

  <div id="status" role="status"></div>

  <dialog id="helpDialog">
    <header><strong data-i18n="helpTitle"></strong><button id="closeHelp" class="icon-button" type="button" aria-label="Close">×</button></header>
    <div class="help-content">
      <p data-i18n="helpIntro"></p>
      <ul>
        <li data-i18n="helpSpace"></li>
        <li data-i18n="helpArrows"></li>
        <li data-i18n="helpTimeline"></li>
        <li data-i18n="helpHold"></li>
        <li data-i18n="helpSite"></li>
      </ul>
    </div>
  </dialog>
  <script src="popup.js"></script>
</body>
</html>
